<div class="backdrop" (click)="isclosedDialog()"></div>
<dialog open>
  <h2>Add Task</h2>
   <!-- Perquè [(ngModel)] funcioni dins d'una etiqueta <form>, 
    és obligatori que l'input tingui l'atribut name (en aquest cas, name="title"). 
    Això es coneix com a two way binding. 
    És necessari importar FormsModule al mòdul perquè funcioni -->
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" [(ngModel)]="enteredTitle" />
    </p>

    <p>
      <label for="summary">Summary</label>
      <textarea id="summary" rows="5" name="summary" [(ngModel)]="enteredSummary"></textarea>
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <input type="date" id="due-date" name="due-date" [(ngModel)]="enteredDate" />
    </p>

    <p class="actions">
      <button type="button" (click)="isclosedDialog()">Cancel</button>
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
